name: BudgetBuddy CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  test-and-audit:
    name: Security, Multi-User Isolation & API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: budgetbuddy_test
          POSTGRES_USER: budgetbuddy_user
          POSTGRES_PASSWORD: budgetbuddy_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Django system check & pending migrations
        env:
          DJANGO_SECRET_KEY: "ci-test-secret-key"
          DJANGO_DEBUG: "False"
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run Automated Test Suite (PostgreSQL + Celery Eager)
        env:
          DJANGO_SECRET_KEY: "ci-test-secret-key"
          DJANGO_DEBUG: "True"
          POSTGRES_DB: budgetbuddy_test
          POSTGRES_USER: budgetbuddy_user
          POSTGRES_PASSWORD: budgetbuddy_pass
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: |
          python manage.py test -v 2

  docker-build:
    name: Validate Docker Image Build
    runs-on: ubuntu-latest
    needs: test-and-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t budgetbuddy:ci .
