services:
  db:
    image: postgres:16-alpine
    container_name: budgetbuddy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-budgetbuddy}
      POSTGRES_USER: ${POSTGRES_USER:-budgetbuddy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budgetbuddy_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-budgetbuddy_user} -d $${POSTGRES_DB:-budgetbuddy}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: budgetbuddy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: budgetbuddy_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      POSTGRES_DB: ${POSTGRES_DB:-budgetbuddy}
      POSTGRES_USER: ${POSTGRES_USER:-budgetbuddy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budgetbuddy_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 3

  celery_worker:
    build: .
    container_name: budgetbuddy_celery
    restart: unless-stopped
    command: celery -A budgetbuddy worker -l info
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-budgetbuddy}
      POSTGRES_USER: ${POSTGRES_USER:-budgetbuddy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budgetbuddy_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
