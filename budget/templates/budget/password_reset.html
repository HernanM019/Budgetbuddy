{% extends 'budget/base.html' %}
{% block title %}Recuperar Contraseña — BudgetBuddy{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="card shadow-sm auth-card">
    <h4 class="mb-2 text-center">🔑 Recuperar contraseña</h4>
    <p class="text-muted text-center small mb-4">Ingresa tu correo electrónico para recibir un enlace de restablecimiento.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary w-100">Enviar instrucciones</button>
    </form>
    <p class="text-center mt-3 mb-0 small"><a href="{% url 'login' %}">Volver al login</a></p>
  </div>
</div>
{% endblock %}
