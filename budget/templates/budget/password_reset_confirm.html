{% extends 'budget/base.html' %}
{% block title %}Nueva Contraseña — BudgetBuddy{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="card shadow-sm auth-card">
    <h4 class="mb-3 text-center">🔒 Definir nueva contraseña</h4>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary w-100">Guardar contraseña</button>
    </form>
  </div>
</div>
{% endblock %}
