services:
  - type: web
    name: budgetbuddy-staging
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py ensure_admin"
    startCommand: "gunicorn budgetbuddy.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        value: "Hernan"
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
